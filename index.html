<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Meci amical</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="gate">
  <h1>Vestiarul e inchis</h1>
  <p>Ca sa intri pe teren ai nevoie de parola. Indiciu: numarul 8 de pe tricou.</p>
  <input id="pw" type="text" placeholder="Parola" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  <div id="err"></div>
  <button class="btn" id="enter" type="button">Intra pe teren</button>
</section>

<section id="game" class="hidden">
  <div id="hud"><span id="score">Goluri 0/6</span><span id="tries">Sutiri 0</span></div>
  <div id="scene">
    <div id="goal"></div>
    <div id="aim"></div>
    <div id="hint">Trage slider-ul si lasa-l ca sa tragi la poarta</div>
    <div id="shout">GOOOL!</div>
    <div id="ball"></div>
    <svg id="player" viewBox="0 0 150 190" aria-label="Jucator cu numarul 8, par lung si barba">
      <rect x="55" y="130" width="22" height="50" rx="9" fill="#f5f7f2"/>
      <rect x="47" y="172" width="38" height="14" rx="7" fill="#111"/>
      <g id="leg"><rect x="78" y="112" width="22" height="68" rx="9" fill="#f5f7f2"/><rect x="78" y="172" width="42" height="14" rx="7" fill="#111"/></g>
      <rect x="48" y="104" width="58" height="34" rx="8" fill="#f5f7f2"/>
      <path d="M44 62c-14 40-8 90 4 96l10-70z" fill="#4a2e1a"/>
      <path d="M106 62c14 40 8 90-4 96l-10-70z" fill="#4a2e1a"/>
      <rect x="42" y="64" width="70" height="62" rx="20" fill="#c8102e"/>
      <text x="77" y="114" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="40" fill="#fff">8</text>
      <rect x="28" y="70" width="18" height="52" rx="9" fill="#c8102e" transform="rotate(12 36 74)"/>
      <rect x="108" y="70" width="18" height="52" rx="9" fill="#c8102e" transform="rotate(-12 118 74)"/>
      <rect x="68" y="56" width="18" height="14" fill="#e0a982"/>
      <ellipse cx="77" cy="38" rx="22" ry="25" fill="#e8b48f"/>
      <path d="M54 40c0 28 12 42 23 42s23-14 23-42c-5 12-12 16-23 16s-18-4-23-16z" fill="#4a2e1a"/>
      <path d="M66 62q11 6 22 0" stroke="#e8b48f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M52 34c-2-24 14-34 26-34s28 8 24 36c-6-14-14-20-25-20s-19 6-25 18z" fill="#4a2e1a"/>
      <circle cx="69" cy="38" r="2.6" fill="#222"/><circle cx="86" cy="38" r="2.6" fill="#222"/>
    </svg>
  </div>
  <div id="panel">
    <p id="plabel">Trage slider-ul spre dreapta: cu cat mai tare, cu atat mingea zboara mai departe</p>
    <input id="pow" type="range" min="0" max="100" value="0" aria-label="Puterea sutului">
  </div>
</section>

<div id="sheet" class="hidden"><div id="card">
  <span id="tag"></span>
  <div id="msg"></div>
  <button class="btn" id="next" type="button">Mai departe</button>
</div></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MSGS = [
    "<h2>Buna, Mihaela!</h2><p>Ti-am facut o mica aplicatie ca sa-ti aduci aminte cum e sa vorbesti cu cineva care chiar depune effort. Stiu, stiu... oricum tie nu-ti plac barbatii astia. 😂</p>",
    "<p>In primul rand, sper ca te-ai simtit bine la ziua fostului. Apropo, te-a chemat pana la urma sau am ratat un episod important?</p>",
    "<p>In al doilea rand, vreau sa-ti multumesc ca te-ai tinut de cuvant si ai revenit. Doar cu o mica intarziere de <b>UN AN</b>. Dar hei, mai bine mai tarziu decat niciodata, nu?</p>",
    "<p>Si nu in ultimul rand, vreau sa stii ca inca mai am cadoul tau, cel pe care urma sa ti-l dau la al treilea date. Sta bine unde e si, din pacate pentru tine, nu cred ca va mai vedea lumina zilei vreodata. 🎁</p>",
    "<p>Bun, suficient. Te tachinam si eu putin. Nu puteam sa ratez ocazia, mai ales dupa un comeback de asemenea proportii.</p><p>Dar sa stii ca tot ce am mentionat mai sus ramane valabil. Nu retragem acuzatiile doar pentru ca am facut o aplicatie draguta.</p>",
    "<p>Acum, hai pe Instagram sa mai depanam amintiri. Chiar sunt curios ce-ai mai facut in tot anul asta. Si, sincer, sper ca viata ti-a mai oferit cateva lectii interesante intre timp. Poate chiar si putina <b>KARMA</b>. 😌</p><p>Hai, apasa pe Continue. Nu te tin aici un an.</p>"
  ];
  var TOTAL = MSGS.length, goals = 0, tries = 0, busy = false;
  var scene = $("scene"), ball = $("ball"), goal = $("goal"), aim = $("aim"), pow = $("pow");
  var H, ballY, goalY, goalHalf;

  /* parola */
  function tryPw() {
    var v = $("pw").value.trim().toLowerCase();
    if (v === "szoboszlai") {
      $("gate").classList.add("hidden");
      $("game").classList.remove("hidden");
      setTimeout(setup, 50);
    } else {
      $("err").textContent = "Gresit. Mai incearca, fotbalistule.";
      $("pw").classList.remove("shake"); void $("pw").offsetWidth; $("pw").classList.add("shake");
    }
  }
  $("enter").addEventListener("click", tryPw);
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") tryPw(); });

  /* teren */
  function setup() {
    H = scene.clientHeight;
    ballY = H - 205;
    ball.style.transition = "none";
    ball.style.opacity = 1;
    ball.style.top = (ballY - 21) + "px";
    ball.style.transform = "none";
    goalHalf = 39 + 6;
    goalY = Math.round(H * (0.10 + Math.random() * 0.22)) + goalHalf;
    goal.style.top = (goalY - goalHalf) + "px";
    pow.value = 0; aim.style.opacity = 0; busy = false;
  }
  window.addEventListener("resize", function () { if (!busy && !$("game").classList.contains("hidden")) setup(); });

  function finalY(p) { return ballY - (p / 100) * ballY * 1.08; }

  pow.addEventListener("input", function () {
    if (busy) return;
    aim.style.opacity = pow.value > 3 ? 1 : 0;
    aim.style.top = (finalY(+pow.value) - 17) + "px";
  });

  function shoot() {
    if (busy || +pow.value < 4) { pow.value = 0; aim.style.opacity = 0; return; }
    busy = true; tries++; $("tries").textContent = "Sutiri " + tries;
    $("hint").textContent = "";
    var fy = finalY(+pow.value), dy = fy - ballY;
    var diff = fy - goalY;
    var ok = Math.abs(diff) <= goalHalf;
    $("player").classList.add("kick");
    setTimeout(function () {
      var t = 450 + Math.abs(dy) * 1.1;
      ball.style.transition = "transform " + t + "ms cubic-bezier(.15,.7,.3,1), opacity " + t + "ms";
      if (fy < 0 || diff < -goalHalf) {
        ball.style.transform = "translateY(" + (dy - 80) + "px) scale(.5)"; ball.style.opacity = 0;
      } else {
        ball.style.transform = "translateY(" + dy + "px)";
      }
      setTimeout(function () { result(ok, diff); }, t + 150);
    }, 250);
  }
  pow.addEventListener("change", shoot);
  pow.addEventListener("touchend", function () { setTimeout(shoot, 0); });

  function result(ok, diff) {
    aim.style.opacity = 0;
    $("player").classList.remove("kick");
    if (ok) {
      goals++; $("score").textContent = "Goluri " + goals + "/" + TOTAL;
      goal.classList.remove("hit"); void goal.offsetWidth; goal.classList.add("hit");
      var s = $("shout"); s.classList.remove("on"); void s.offsetWidth; s.classList.add("on");
      setTimeout(function () { openSheet(goals - 1); }, 1100);
    } else {
      $("hint").textContent = diff > 0 ? "Prea slab! Trage mai tare." : "Prea tare! Mingea a zburat peste poarta.";
      setTimeout(setup, 900);
    }
  }

  /* mesaje dupa gol */
  var idx = 0;
  function openSheet(i) {
    idx = i;
    $("tag").textContent = "Gol " + (i + 1) + " din " + TOTAL;
    $("msg").innerHTML = MSGS[i];
    $("next").textContent = i === TOTAL - 1 ? "Continue" : "Mai departe";
    $("sheet").classList.remove("hidden");
  }
  $("next").addEventListener("click", function () {
    if (idx === TOTAL - 1) { window.location.href = "https://www.instagram.com/andreigheo/"; return; }
    $("sheet").classList.add("hidden");
    $("hint").textContent = "Hai la urmatorul gol!";
    setup();
  });
})();
</script>
</body>
</html>
